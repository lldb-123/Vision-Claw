# STM32F405/F407 device group, using OpenOCD's official STM32F4 flash driver.
# Keep a stable low SWD clock through the programming helper's reset-init.
# The stock target file otherwise increases it to 8MHz during programming.
stm32f4x.cpu configure -event reset-start { adapter speed 100 }
stm32f4x.cpu configure -event reset-init { adapter speed 100 }
init
reset halt
set device_id [expr {[mrw 0xE0042000] & 0xfff}]
if {$device_id != 0x413} {
    error "Expected STM32F405/F407 device ID 0x413; no firmware written."
}
# Only sector 0 is affected by the small test image. Preserve it before writing.
if {![file exists original_sector0.bin]} {
    dump_image original_sector0.bin 0x08000000 0x4000
}
program motor_test.hex verify
# Wait for the user to press RESET; do not start the motor from the downloader.
reset halt
mmw 0x40023830 0x1 0
mww 0x40020018 0x00030010
mmw 0x40020004 0 0x13
mmw 0x40020000 0x105 0x30f
echo "Firmware ready. CPU halted, EN high. Press board RESET to start continuous rotation."
shutdown
